name: mediconnect
description: MediConnect - Application médicale de mise en relation patients et médecins
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  # ICONS & FONTS
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # UI & ANIMATIONS
  animate_do: ^3.3.4         # Updated to latest stable
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0  # Corrected from non-existent version
  
  # UTILS
  provider: ^6.1.2           # Updated to latest stable
  intl: ^0.19.0              # Corrected from non-existent version

  # MAP - Corrected from non-existent version 8.3.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # FIREBASE - Updated to the latest compatible versions
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  shared_preferences: ^2.5.5
  geocoding: ^4.0.0
  font_awesome_flutter: ^10.7.0
  geolocator: ^12.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Corrected to a valid version

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
